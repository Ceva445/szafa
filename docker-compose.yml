services:

  backend:
    build: .

    container_name: szafa-backend

    # всі змінні (DATABASE_URL, SECRET_KEY, ...) беруться з .env
    env_file:
      - .env

    volumes:
      - ./media:/app/media
      - ./uploads:/app/uploads

    # 8001 назовні, щоб не конфліктувати з pinokio (8000)
    ports:
      - "8001:8000"

    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy


  db:
    image: postgres:17

    container_name: szafa-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  postgres_data:
